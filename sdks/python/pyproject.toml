[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "heterarchy-broker-sdk"
version = "0.1.0"
description = "Typed Python client SDK for the Rust Heterarchy Agent Broker"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Heterarchy Systems" }]
dependencies = []

[dependency-groups]
dev = [
    "pyrefly==1.2.0",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.pyrefly]
python-version = "3.11"
project-includes = ["src", "tests"]
